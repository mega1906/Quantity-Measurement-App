<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantity Measurement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero-banner">
        <div class="container">
          <h1 class="hero-title">Welcome To Quantity Measurement</h1>
        </div>
      </header>

      <main class="container content-wrap">
        <section class="mb-5">
          <h2 class="section-title">Choose Type</h2>
          <div class="row g-4">
            <div class="col-12 col-sm-6 col-lg-3">
              <article class="choice-card choice-card-active">
                <div class="choice-icon">📏</div>
                <h3 class="choice-label">Length</h3>
              </article>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
              <article class="choice-card">
                <div class="choice-icon">⚖️</div>
                <h3 class="choice-label">Weight</h3>
              </article>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
              <article class="choice-card">
                <div class="choice-icon">🌡️</div>
                <h3 class="choice-label">Temperature</h3>
              </article>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
              <article class="choice-card">
                <div class="choice-icon">🧪</div>
                <h3 class="choice-label">Volume</h3>
              </article>
            </div>
          </div>
        </section>

        <section class="mb-5">
          <h2 class="section-title">Choose Action</h2>
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <div class="action-pill action-pill-active">Comparison</div>
            </div>
            <div class="col-12 col-md-4">
              <div class="action-pill">Conversion</div>
            </div>
            <div class="col-12 col-md-4">
              <div class="action-pill">Arithmetic</div>
            </div>
          </div>
        </section>

        <section>
          <div class="row g-4">
            <div class="col-12 col-lg-6">
              <div class="input-panel">
                <label class="panel-title" for="from-value">From</label>
                <div class="display-box">
                  <div class="display-value" id="from-value">1</div>
                </div>
                <div class="select-box">
                  <select class="unit-select" name="from-unit" aria-label="Select from unit">
                    <option selected>Kilometer</option>
                    <option>Meter</option>
                    <option>Centimeter</option>
                    <option>Millimeter</option>
                    <option>Mile</option>
                  </select>
                  <span class="select-arrow">▼</span>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-6">
              <div class="input-panel">
                <label class="panel-title" for="to-value">To</label>
                <div class="display-box">
                  <div class="display-value" id="to-value">1000</div>
                </div>
                <div class="select-box">
                  <select class="unit-select" name="to-unit" aria-label="Select to unit">
                    <option>Kilometer</option>
                    <option selected>Meter</option>
                    <option>Centimeter</option>
                    <option>Millimeter</option>
                    <option>Mile</option>
                  </select>
                  <span class="select-arrow">▼</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
