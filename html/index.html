<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantity Measurement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero-banner">
        <div class="container">
          <h1 class="hero-title">Welcome To Quantity Measurement</h1>
        </div>
      </header>

      <main class="container content-wrap">
        <div id="error-banner" class="error-banner d-none" role="alert"></div>

        <section class="mb-5">
          <h2 class="section-title">Choose Type</h2>
          <div class="row g-4">
            <div class="col-12 col-sm-6 col-lg-3">
              <article class="choice-card type-card" data-type="Length">
                <div class="choice-icon">📏</div>
                <h3 class="choice-label">Length</h3>
              </article>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
              <article class="choice-card type-card" data-type="Weight">
                <div class="choice-icon">⚖️</div>
                <h3 class="choice-label">Weight</h3>
              </article>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
              <article class="choice-card type-card" data-type="Temperature">
                <div class="choice-icon">🌡️</div>
                <h3 class="choice-label">Temperature</h3>
              </article>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
              <article class="choice-card type-card" data-type="Volume">
                <div class="choice-icon">🧪</div>
                <h3 class="choice-label">Volume</h3>
              </article>
            </div>
          </div>
        </section>

        <section class="mb-5">
          <h2 class="section-title">Choose Action</h2>
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <button type="button" class="action-pill action-button" data-action="Comparison">
                Comparison
              </button>
            </div>
            <div class="col-12 col-md-4">
              <button
                type="button"
                class="action-pill action-button"
                data-action="Conversion"
              >
                Conversion
              </button>
            </div>
            <div class="col-12 col-md-4">
              <button type="button" class="action-pill action-button" data-action="Arithmetic">
                Arithmetic
              </button>
            </div>
          </div>
        </section>

        <section id="operator-row" class="operator-row d-none mb-5" aria-label="Arithmetic operators">
          <div class="operator-select-wrap">
            <select id="operator-select" class="operator-select" aria-label="Select arithmetic operator">
              <option value="+">+</option>
              <option value="-">-</option>
              <option value="*">*</option>
              <option value="/">/</option>
            </select>
            <span class="operator-select-arrow">▼</span>
          </div>
        </section>

        <section>
          <div class="row g-4">
            <div class="col-12 col-lg-6">
              <div class="input-panel">
                <label class="panel-title" for="from-value">From</label>
                <div class="display-box">
                  <div class="display-value" id="from-value">1</div>
                </div>
                <div class="select-box">
                  <select
                    id="from-unit"
                    class="unit-select"
                    name="from-unit"
                    aria-label="Select from unit"
                  ></select>
                  <span class="select-arrow">▼</span>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-6">
              <div class="input-panel">
                <label class="panel-title" for="to-value">To</label>
                <div class="display-box">
                  <div class="display-value" id="to-value">1000</div>
                </div>
                <div class="select-box">
                  <select
                    id="to-unit"
                    class="unit-select"
                    name="to-unit"
                    aria-label="Select to unit"
                  ></select>
                  <span class="select-arrow">▼</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="result-section">
          <h2 class="section-title">Result</h2>
          <div id="result-panel" class="result-panel">
            <div id="result-value" class="result-value">—</div>
            <div id="result-unit" class="result-unit"></div>
          </div>
        </section>

        <section class="history-section">
          <div class="history-header">
            <h2 class="section-title mb-0">History</h2>
          </div>
          <ul id="history-list" class="history-list"></ul>
        </section>
      </main>
    </div>
    <script src="../js/conversion.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
